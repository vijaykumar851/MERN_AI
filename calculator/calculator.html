<html>
    <head>
        <title>Calculator</title>
        <style>
            body {
                display: flex;
                justify-content: center;
                align-items: center;
                min-height: 100vh;
            }
            .container {
                display: grid;
                grid-template-columns: 1fr 1fr 1fr 1fr;
                background-color: black;
                max-width: 300px;
                max-height: 500px;
                padding: 70px 20px 40px 20px;
                row-gap: 10px;
                column-gap: 10px;
                border-radius: 30px;
                
            }
            .display-container{
                grid-column: span 4;       
                display: flex;
                flex-direction: column;
                justify-content: flex-end;
                text-align: right;
                padding: 10px;      
                box-sizing: border-box;
            }
            #history{
                color: #a5a5a5;            
                font-size: 24px;
                min-height: 28px;

            }
            #screen{
                color: white;            
                font-size: 45px;
                min-height: 50px;
                
            }

            .btn {
                height: 60px;
                width: 60px;
                color: white;
                background-color: #464545be;
                border-radius: 15px;
                border: none;
                cursor: pointer;
                
            }
            .zero {
                grid-column-start: 1;
                grid-column-end: 3;
                width: 130px;
                
            }
            .btn-gray {
                background-color: gray;
            }
            .orange {
                background-color: orange;
            }
            .screen{
                color: rgb(238, 234, 234);
                display: block;
            }

        </style>
    </head>
    <body>
        <div class="container">
            <div class="display-container">
                <div id="history">1</div>
                <div id="screen">0</div>
            </div>
                


            <button class="btn btn-gray">C</button><button class="btn btn-gray">+/-</button>
            <button class="btn btn-gray">%</button><button class="btn orange">/</button>
            <button class="btn">7</button><button class="btn">8</button>
            <button class="btn">9</button><button class="btn orange">x</button>
            <button class="btn">4</button><button class="btn">5</button>
            <button class="btn">6</button><button class="btn orange">-</button>
            <button class="btn">1</button><button class="btn">2</button>
            <button class="btn">3</button><button class="btn orange">+</button>
            <button class="btn zero">0</button><button class="btn">.</button>
            <button class="btn orange">=</button>
            
        </div>
    </body>
</html>
