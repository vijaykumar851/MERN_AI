<html>
<head>
<title> flex </title>
<style>
*{
margin : 0;
padding: 0;
}

button {
color: white;
background-color: black;
border:none;
padding-left: 10px;
cursor : pointer;
}
.navbar button:hover {
background-color: lightblue;
padding: 10px;
border: 1px black;
border-radius: 20px;
}

.navbar{
background-color : black;
display:flex;
justify-content: space-between;
height: 50px;
align-items: center;
}
.left{
padding-left: 15px;
}
.right{
padding-right: 15px;
}
</style>
</head>
<body>
<header class = "navbar">
<div class = "left">
<button> NavBar </button>
<button> Home </button>
<button> Features </button>
<button> Pricing </button>
</div>
<div class = "right">
<button> NavBar text with an inline element </button>
</div>
</header>
</body>
</html>
